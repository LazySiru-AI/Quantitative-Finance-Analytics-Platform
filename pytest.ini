# Root-level pytest configuration.
#
# Why this file exists: `backend/pyproject.toml` already has a [tool.pytest.ini_options] section,
# and running `pytest tests` *with an explicit path* from the repository root happens to work today
# because `python -m pytest` prepends the current working directory to sys.path itself (a CPython
# `-m` behaviour, nothing to do with pytest config discovery). But pytest's own config-file search
# walks upward from the given args looking for pytest.ini / pyproject.toml / tox.ini / setup.cfg,
# and the repository root had none of those -- so no config, and specifically no `norecursedirs`,
# was ever in effect for root invocations. A *bare* `pytest` (no path argument) falls back to
# discovering tests from the current directory, walks into the gitignored vendored checkout at
# `tools/vendor/`, finds its own `conftest.py` (also named `tests/conftest.py` one level down,
# since neither tree has `__init__.py`), and pytest aborts collection with
# `_pytest.pathlib.ImportPathMismatchError` before running a single test of ours.
#
# This file is a pytest.ini (not a root pyproject.toml) deliberately: a root pyproject.toml would
# risk being picked up by packaging tooling (`pip install -e "backend[dev]"` installs from
# backend/, not root) and by other tools that treat pyproject.toml as project metadata. A
# pytest-only file has no such surface.
#
# Keep in sync with backend/pyproject.toml's [tool.pytest.ini_options] if you change either --
# pytest has no "include another config" mechanism, so these are two independent copies of the same
# intent, expressed with path prefixes relative to each file's own directory:
#   backend/pyproject.toml: testpaths = ["../tests"]   pythonpath = [".", ".."]
#   here (repo root):       testpaths = tests           pythonpath = . backend
#
# mypy has an analogous "no config found from the root" problem; see the root-invocation note under
# the "Development" section of README.md rather than a second config file here.
[pytest]
testpaths = tests
# "." puts the repository root itself on sys.path, which is what lets the 11 test modules that do
# `from tests.conftest import ...` resolve (tests/ has no __init__.py, so without this the package
# name "tests" is not importable). "backend" is included for symmetry with backend/pyproject.toml
# and as a safety net if the editable install of `app` (backend/) is ever missing from the venv.
pythonpath = . backend
# `-q` is deliberately NOT here, and was removed from backend/pyproject.toml to match.
# A quiet flag in `addopts` cannot be turned off from the command line, and it *stacks*: the
# documented invocation `pytest tests -q` became `-q -q`, which is pytest's second quiet level and
# suppresses the final "N passed" summary line entirely. That surfaced immediately after this file
# was added -- root invocations previously found no config at all, so the command-line `-q` was the
# only one. Verbosity is a display preference and belongs on the command line; `--strict-markers`
# is a correctness gate and belongs here.
addopts = --strict-markers
filterwarnings = error::DeprecationWarning
# Same reasoning as backend/pyproject.toml: without this, a bare `pytest` (or `pytest .`) from the
# root walks into the gitignored vendored clone under tools/vendor/, which carries its own
# conftest.py and collides with tests/conftest.py under pytest's default import mode.
norecursedirs = tools *.egg .* build dist node_modules
